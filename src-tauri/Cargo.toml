[package]
name = "contentdock"
version = "1.0.0"
description = "ContentDock Desktop Application (Windows MSVC C++)"
authors = ["ContentDock"]
edition = "2021"

[lib]
name = "contentdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
incremental = false
codegen-units = 1

[profile.dev.build-override]
opt-level = 0
codegen-units = 1

[profile.release]
incremental = false
codegen-units = 1
lto = false

[profile.release.build-override]
opt-level = 0
codegen-units = 1

